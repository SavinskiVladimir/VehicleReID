name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Сервис-контейнер PostgreSQL с расширением pgvector: интеграционные тесты
    # (репозиторий, пакетная загрузка, журнал поиска, /health) проверяют реальные
    # SQL-запросы и схему, а не моки.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb

    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш pip-пакетов
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-test.txt', 'constraints.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # CPU-only сборка PyTorch: в CI нет GPU, а CPU-версия значительно легче полной
      # CUDA-сборки по умолчанию. Версии torch/torchvision берутся из constraints.txt,
      # чтобы CI запускал тесты на тех же версиях, на которых они проходили.
      - name: Установка PyTorch (CPU-only, версии из constraints.txt)
        run: |
          pip install $(grep -E '^(torch|torchvision)==' constraints.txt | tr '\n' ' ') --index-url https://download.pytorch.org/whl/cpu

      - name: Установка остальных зависимостей (версии закреплены constraints.txt)
        run: |
          pip install -r requirements-test.txt -c constraints.txt

      - name: Включение расширения vector в тестовой БД
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Запуск тестов
        run: |
          pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Настройка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci ставит РОВНО версии из package-lock.json (в отличие от npm install)
      - name: Установка зависимостей
        run: npm ci

      - name: Сборка
        run: npm run build