name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  pytest:
    runs-on: ubuntu-latest

    # Сервис-контейнер PostgreSQL с расширением pgvector - нужен для
    # интеграционных тестов backend/app/db/repository.py
    # (tests/test_repository.py), которые проверяют реальные SQL-запросы
    # (в т.ч. оператор косинусного расстояния pgvector), а не моки.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://testuser:testpass@localhost:5432/testdb

    steps:
      - name: Checkout код
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Кэш pip-пакетов
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-test.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # CPU-only сборка PyTorch: в CI нет GPU, а CPU-версия значительно
      # легче и быстрее скачивается, чем полная CUDA-сборка по умолчанию.
      - name: Установка PyTorch (CPU-only)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Установка остальных зависимостей
        run: |
          pip install -r requirements-test.txt

      - name: Включение расширения vector в тестовой БД
        run: |
          PGPASSWORD=testpass psql -h localhost -U testuser -d testdb -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Запуск тестов
        run: |
          pytest -v