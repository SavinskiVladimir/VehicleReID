services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Данные переживают перезапуск/пересборку контейнера.
      - pgdata:/var/lib/postgresql/data
      # Выполняется ТОЛЬКО при первой инициализации пустого volume -
      # если база уже существует (volume не пустой), файл повторно
      # не выполнится, даже если его изменить. Расширение CREATE
      # EXTENSION в нём безопасно ставить один раз.
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: