# Конфигурация nginx клиентской части (кладётся в /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Лимит приложения - 10 МБ на файл (MAX_UPLOAD_SIZE_BYTES). Здесь чуть больше, чтобы файл от 10 до 11 МБ
    # дошёл до приложения и получил его понятное сообщение 400, а не безликий 413 от nginx. Тело multipart
    # включает служебные заголовки части, поэтому запас нужен и для файла ровно на лимите.
    client_max_body_size 11m;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        return 413 '{"detail":"Файл слишком большой. Максимальный размер - 10 МБ."}';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # Docker-DNS (127.0.0.11) и имя сервиса в переменной: nginx находит backend в момент запроса, а не при старте.
    # Иначе при старте раньше backend он падал бы с "host not found in upstream", а после пересоздания
    # контейнера backend держал бы устаревший IP.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Холодный первый запрос к ReID может занимать секунды (см. замеры этапа 8).
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Проверка готовности для приёмки и мониторинга: curl http://<адрес>/health
    location = /health {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Файлы с хешем в имени можно кэшировать на год: при новой сборке имя меняется.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # index.html никогда не кэшируется: иначе браузер показывал бы старый интерфейс (с устаревшими именами
    # файлов в assets) после обновления.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}